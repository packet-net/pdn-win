# pdn-lin: keep the desktop's sound server off the AIOC, so that pdn-lin can open the card
# directly: nothing between the modem and the converter, and no "device busy". The AIOC is only
# ever a radio interface, so this cannot take anyone's headset away. (A CM108 dongle may be
# either, so it is left alone; pdn-lin goes through PipeWire for one the desktop holds.)
#
# WirePlumber 0.5 and later. 0.4 reads the Lua beside this instead.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1209"
        device.product.id = "0x7388"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
