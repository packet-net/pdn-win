name: CI

# Build and test on every push to main and every pull request.
#
# GitHub-hosted Windows: this is a public repository (standard hosted runners are free) and the app
# is WPF, which needs Windows; the org's self-hosted runners are Linux.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pdn-win
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdn-win

      # pdn-soundmodem's Windows library is not a published package yet, so it is built from a
      # checkout beside this one, at the commit pinned in build/pdn-soundmodem.ref.
      - name: Read pinned pdn-soundmodem commit
        id: dep
        run: '"ref=$((Get-Content build/pdn-soundmodem.ref -Raw).Trim())" >> $env:GITHUB_OUTPUT'

      - uses: actions/checkout@v4
        with:
          repository: packet-net/pdn-soundmodem
          ref: ${{ steps.dep.outputs.ref }}
          path: pdn-soundmodem

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build pdn-win.slnx -c Release

      - name: Test
        run: dotnet test tests/PdnWin.Core.Tests -c Release --no-build
