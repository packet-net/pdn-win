name: CI

# Build and test on every push to main and every pull request.
#
# GitHub-hosted Windows: this is a public repository (standard hosted runners are free) and the app
# is WPF, which needs Windows; the org's self-hosted runners are Linux.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build pdn-win.slnx -c Release

      - name: Test
        run: dotnet test tests/PdnWin.Core.Tests -c Release --no-build
