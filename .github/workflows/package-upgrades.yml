name: package upgrades

# The bump is computed once (full, and security-only as a fallback) and each result is tested on
# Windows and on Linux (including the .deb) as ci.yml does. The commit happens only if one variant
# passes on both platforms; the full bump is preferred. Runs on GitHub-hosted runners, as CI does.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but do not commit or push"
        type: boolean
        default: false

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always the default branch: a manual run from a feature branch must not push it to main.
          ref: main

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compute the full and security-only bumps
        run: |
          set -euo pipefail
          mkdir -p out/full out/security
          python3 scripts/bump-packages.py pdn-win.slnx | tee out/full/upgrades.txt
          git diff > out/full/bump.diff
          git reset --hard
          git clean -fdx -e out
          python3 scripts/bump-packages.py pdn-win.slnx --vulnerable-only | tee out/security/upgrades.txt
          git diff > out/security/bump.diff

      - uses: actions/upload-artifact@v7
        with:
          name: bump-full
          path: out/full
      - uses: actions/upload-artifact@v7
        with:
          name: bump-security
          path: out/security

  test-full:
    needs: bump
    uses: ./.github/workflows/package-upgrades-test.yml
    with:
      variant: full
      sha: ${{ needs.bump.outputs.sha }}

  test-security:
    needs: bump
    uses: ./.github/workflows/package-upgrades-test.yml
    with:
      variant: security
      sha: ${{ needs.bump.outputs.sha }}

  commit:
    needs: [bump, test-full, test-security]
    # Run even when one variant failed; the step below picks the one that passed on both platforms.
    if: ${{ !cancelled() && needs.bump.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Choose the variant
        id: pick
        env:
          FULL: ${{ needs.test-full.result }}
          SECURITY: ${{ needs.test-security.result }}
        run: |
          if [ "$FULL" = success ]; then echo "variant=full" >> "$GITHUB_OUTPUT"
          elif [ "$SECURITY" = success ]; then echo "variant=security" >> "$GITHUB_OUTPUT"
          else echo "::error::neither the full nor the security-only bump passed on both platforms"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: bump-${{ steps.pick.outputs.variant }}
          path: ${{ runner.temp }}/bump

      - name: Commit and push
        env:
          VARIANT: ${{ steps.pick.outputs.variant }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/bump/bump.diff" ]; then
            echo "nothing to upgrade"
            exit 0
          fi
          git apply "$RUNNER_TEMP/bump/bump.diff"
          if [ "$VARIANT" = full ]; then SUBJECT="chore(deps): package upgrades"; else SUBJECT="chore(deps): security package fixes"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          {
            echo "$SUBJECT"
            echo
            echo "Package versions changed by scripts/bump-packages.py:"
            cat "$RUNNER_TEMP/bump/upgrades.txt"
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: not pushing"
            git show --stat HEAD
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
