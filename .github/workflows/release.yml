name: Release

# Push a version tag (x.y.z, no "v") to build, test and publish a GitHub Release named "x.y.z" with
# two assets: the MSI and the portable single-file exe. The notes come from the "## x.y.z" section
# of CHANGELOG.md, which must exist for a tag build. See docs/releasing.md for the procedure.
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: the same build, uploaded as a
# workflow artifact, and no release.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run build (x.y.z)
        default: 0.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, for the release notes' previous-version link

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Work out version
        id: version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be x.y.z (got '$v')." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check the changelog has this version
        if: github.ref_type == 'tag'
        run: |
          $v = '${{ steps.version.outputs.version }}'
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^##\s+$([regex]::Escape($v))(\s|$)" -Quiet)) {
            throw "CHANGELOG.md has no '## $v' section. Add it, then move the tag (docs/releasing.md)."
          }

      - name: Test
        run: dotnet test tests/PdnWin.Core.Tests -c Release

      - name: Build MSI and portable exe
        run: ./build/build-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Release notes
        run: ./build/release-notes.ps1 -Version '${{ steps.version.outputs.version }}' -Ref '${{ github.ref_type == 'tag' && github.ref_name || 'HEAD' }}' -OutFile notes.md

      - name: Upload dry-run build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: pdn-win-dry-run-${{ steps.version.outputs.version }}
          path: |
            dist/
            notes.md

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
